[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrunner55"
version = "0.1.0"
description = "Application desktop Linux pour synchroniser Garmin Connect et une montre Forerunner 55"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "OpenRunner55" }]
dependencies = [
    "garminconnect==0.3.9",
    "secretstorage>=3.5",
    "PyGObject>=3.50",
    "pyudev>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
openrunner55 = "openrunner55.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "unit: tests unitaires sans dépendances externes (mocks uniquement)",
    "integration: tests d'intégration réelle (montre FR55 branchée)",
    "network: tests réseau réel (compte Garmin Connect)",
]
testpaths = ["tests"]
addopts = "-m unit"
